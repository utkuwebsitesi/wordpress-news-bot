services:
  certs:
    image: alpine:3.22
    volumes: [certs:/certs]
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null &&
      test -f /certs/ca.crt ||
      (openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=WPNB-Test-CA -keyout /certs/ca.key -out /certs/ca.crt &&
      openssl req -newkey rsa:2048 -nodes -subj /CN=feed.test -addext subjectAltName=DNS:feed.test,DNS:www.feed.test,DNS:openai.test -keyout /certs/server.key -out /certs/server.csr &&
      openssl x509 -req -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key -CAcreateserial -days 2 -copy_extensions copy -out /certs/server.crt)"
  db:
    image: mariadb:10.11
    command:
      [
        "--default-storage-engine=${WPNB_DB_ENGINE:-InnoDB}",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      {
        test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot"],
        interval: 5s,
        timeout: 3s,
        retries: 30,
      }
  mock:
    image: nginx:1.29-alpine
    command:
      - /bin/sh
      - -c
      - >-
        cp -r /fixtures /tmp/fixtures &&
        base64 -d /fixtures/image.png.b64 > /tmp/fixtures/image-1.png &&
        cp /tmp/fixtures/image-1.png /tmp/fixtures/image-2.png && printf a >> /tmp/fixtures/image-2.png &&
        cp /tmp/fixtures/image-1.png /tmp/fixtures/image-3.png && printf b >> /tmp/fixtures/image-3.png &&
        cp /tmp/fixtures/image-1.png /tmp/fixtures/image-large.png && dd if=/dev/zero bs=1024 count=80 >> /tmp/fixtures/image-large.png 2>/dev/null &&
        exec nginx -g 'daemon off;'
    depends_on: { certs: { condition: service_completed_successfully } }
    volumes:
      - certs:/certs:ro
      - ../fixtures:/fixtures:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      wpnb_net: { ipv4_address: 93.184.216.34 }
  wordpress:
    build:
      context: ../..
      dockerfile: tests/infra/Dockerfile.wordpress
      args:
        { WORDPRESS_IMAGE: "${WPNB_WP_IMAGE:-wordpress:7.0.4-php8.3-apache}" }
    depends_on:
      {
        db: { condition: service_healthy },
        certs: { condition: service_completed_successfully },
        mock: { condition: service_started },
      }
    entrypoint:
      - sh
      - -c
      - >-
        cp /certs/ca.crt /usr/local/share/ca-certificates/wpnb-test-ca.crt &&
        update-ca-certificates >/dev/null &&
        exec docker-entrypoint.sh apache2-foreground
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: "define('WP_DEBUG_LOG', true); define('WP_DEBUG_DISPLAY', false); define('SCRIPT_DEBUG', true); define('DISABLE_WP_CRON', true); if (defined('WP_CLI') && WP_CLI && empty($$_SERVER['HTTP_HOST'])) $$_SERVER['HTTP_HOST'] = 'localhost';"
    extra_hosts:
      [
        "feed.test:93.184.216.34",
        "www.feed.test:93.184.216.34",
        "openai.test:93.184.216.34",
      ]
    volumes:
      - wordpress:/var/www/html
      - certs:/certs:ro
      - ${WPNB_ARTIFACTS_DIR:?Set WPNB_ARTIFACTS_DIR}:/artifacts:ro
      - ../integration:/integration:ro
    ports: ["${WPNB_HTTP_PORT:-8080}:80"]
    networks: [default, wpnb_net]
volumes: { wordpress: {}, certs: {} }
networks:
  wpnb_net:
    ipam: { config: [{ subnet: 93.184.216.0/24 }] }
