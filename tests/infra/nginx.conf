events {}
http {
  gzip on;
  gzip_types application/rss+xml application/atom+xml application/xml text/xml;
  server {
    listen 443 ssl;
    server_name feed.test openai.test;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    root /tmp/fixtures;
    location = /rss.xml { default_type application/rss+xml; try_files /rss.xml =404; }
    location = /atom.xml { default_type application/atom+xml; try_files /atom.xml =404; }
    location = /news-atom.xml { default_type application/atom+xml; try_files /news-atom.xml =404; }
    location = /sports-atom.xml { default_type application/atom+xml; try_files /atom.xml =404; }
    location = /images/one.png { default_type image/png; try_files /image-1.png =404; }
    location = /images/two.png { default_type image/png; try_files /image-2.png =404; }
    location = /images/three.png { default_type image/png; try_files /image-3.png =404; }
    location = /images/large.png { default_type image/png; try_files /image-large.png =404; }
    location = /images/redirect.png { return 302 https://feed.test/images/one.png; }
    location = /images/private-redirect.png { return 302 https://127.0.0.1/image.png; }
    location = /images/fake.jpg { default_type image/jpeg; return 200 '<html><body>not an image</body></html>'; }
    location = /images/broken.jpg { return 404; }
    location = /rdf.xml { default_type application/xml; try_files /rdf.xml =404; }
    location = /generic.xml { default_type application/octet-stream; try_files /rss.xml =404; }
    location = /redirect { return 302 https://feed.test/rss.xml; }
    location = /private-redirect { return 302 https://127.0.0.1/feed; }
    location = /empty { default_type application/xml; return 200 ''; }
    location = /broken { default_type application/xml; return 200 '<rss>'; }
    location = /blocked { default_type text/html; return 200 '<html><title>Blocked</title></html>'; }
    location = /rate-limited { return 429; }
    location = /server-error { return 503; }
    location = /v1/responses {
      default_type application/json;
      if ($http_authorization = "Bearer invalid-key") { return 401; }
      error_page 418 =200 /openai-response.json;
      return 418;
      add_header x-request-id req_local_fixture always;
    }
    location = /v1/invalid-responses {
      default_type application/json;
      return 200 '{"output":[]}';
      add_header x-request-id req_invalid_fixture always;
    }
  }
}
