name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wpnb_test
          MARIADB_USER: wpnb
          MARIADB_PASSWORD: wpnb_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwpnb -pwpnb_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, libxml, mbstring, pdo_mysql, simplexml, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
        env:
          WPNB_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpnb_test;charset=utf8mb4
          WPNB_TEST_DB_USER: wpnb
          WPNB_TEST_DB_PASSWORD: wpnb_test_password
