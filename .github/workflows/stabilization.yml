name: Stabilization gates

on:
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: stabilization-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} / MariaDB InnoDB
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { php: ["8.1", "8.3"] } }
    services:
      mariadb:
        image: mariadb:10.11
        env:
          {
            MARIADB_DATABASE: wpnb_test,
            MARIADB_USER: wpnb,
            MARIADB_PASSWORD: wpnb_test_password,
            MARIADB_ROOT_PASSWORD: root_test_password,
          }
        ports: ["3306:3306"]
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwpnb -pwpnb_test_password" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          {
            php-version: "${{ matrix.php }}",
            extensions: "dom,libxml,mbstring,pdo_mysql,simplexml,sodium,zip",
            coverage: none,
          }
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/phpunit --colors=never
        env:
          {
            WPNB_TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=wpnb_test;charset=utf8mb4",
            WPNB_TEST_DB_USER: wpnb,
            WPNB_TEST_DB_PASSWORD: wpnb_test_password,
          }

  php-myisam:
    name: PHP 8.3 / MariaDB MyISAM default
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          {
            MARIADB_DATABASE: wpnb_test,
            MARIADB_USER: wpnb,
            MARIADB_PASSWORD: wpnb_test_password,
            MARIADB_ROOT_PASSWORD: root_test_password,
          }
        ports: ["3306:3306"]
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -uwpnb -pwpnb_test_password" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          {
            php-version: "8.3",
            extensions: "dom,libxml,mbstring,pdo_mysql,simplexml,sodium,zip",
            coverage: none,
          }
      - run: sudo apt-get update && sudo apt-get install -y mariadb-client && mariadb -h127.0.0.1 -uroot -proot_test_password -e "SET GLOBAL default_storage_engine=MyISAM"
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --colors=never
        env:
          {
            WPNB_TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=wpnb_test;charset=utf8mb4",
            WPNB_TEST_DB_USER: wpnb,
            WPNB_TEST_DB_PASSWORD: wpnb_test_password,
          }

  static-release:
    name: Static, i18n, secrets and release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mbstring,zip", coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php bin/quality-gates.php
      - run: php bin/compile-mo.php languages/wordpress-news-bot-tr_TR.po /tmp/wordpress-news-bot-tr_TR.mo && cmp /tmp/wordpress-news-bot-tr_TR.mo languages/wordpress-news-bot-tr_TR.mo
      - run: mkdir -p dist && php bin/build-release.php 0.5.0-rc.5 "$PWD" "$PWD/dist/wordpress-news-bot-0.5.0-rc.5.zip"
      - name: Build historical upgrade packages
        run: |
          set -euo pipefail
          for row in '0.3.0 ffa89515c233df681572c41204bedef6adaf9907' '0.3.1 c7e5d5b6614e6b7a9c0116ce6f3d1b7aa8e85002' '0.3.2 9513c3d416c5f0b832623e6a4867e9d51ca99fc0' '0.3.3 80b6fc4abfcbe88233a8cda2e4b9d71896ebc982' '0.3.4 6665ec13febc70ce427522a9fdf0916375a86eff' '0.3.5 5ab7a0647a57c5755415e641ad3584622b0a10a5' '0.4.0-rc.1 8f09e2a72e2bd1b45cbe102a95535eaa2b55110c' '0.4.0-rc.2 2994fcce0d6472763d3532281e76611bc5b7bb39' '0.4.0-rc.3 1a02e841d843b7a4c112094b054a12b87f377c34' '0.4.0-rc.4 f853cc3f0f2233591a1f9ee893df83a083985386' '0.5.0-rc.1 2caa5779281ac1e442e811a718d1d7f589608e1b' '0.5.0-rc.2 4a75e0836b6523e5ae6d05945807e9646bc58e08' '0.5.0-rc.3 3aff36db66d40db616cf50b13757524c62d21e5c' '0.5.0-rc.4 0ae2f30e8b83b05e80e78a80a1d6671e099b1c5f'; do
            read -r version ref <<< "$row"; work=$(mktemp -d); git archive --format=zip --output="$work/source.zip" "$ref"; unzip -q "$work/source.zip" -d "$work/source"; php bin/build-release.php "$version" "$work/source" "$PWD/dist/wordpress-news-bot-$version.zip"; rm -rf "$work";
          done
      - run: sha256sum dist/*.zip | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          {
            name: wordpress-news-bot-rc-packages,
            path: dist/,
            if-no-files-found: error,
            retention-days: 14,
          }

  wordpress-install:
    name: ZIP install / ${{ matrix.label }}
    needs: static-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              label: "WP 7.0.4 PHP 8.3 MyISAM default",
              image: "wordpress:7.0.4-php8.3-apache",
              engine: MyISAM,
            }
          - {
              label: "WP 7.0.4 PHP 8.3 InnoDB default",
              image: "wordpress:7.0.4-php8.3-apache",
              engine: InnoDB,
            }
          - {
              label: "WP 6.4 PHP 8.1 minimum",
              image: "wordpress:6.4-php8.1-apache",
              engine: InnoDB,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wordpress-news-bot-rc-packages, path: dist }
      - run: bash tests/integration/run-install.sh
        env:
          {
            WPNB_ARTIFACTS_DIR: "${{ github.workspace }}/dist",
            WPNB_WP_IMAGE: "${{ matrix.image }}",
            WPNB_DB_ENGINE: "${{ matrix.engine }}",
            WPNB_PROJECT: "wpnb-install-${{ strategy.job-index }}",
          }

  upgrade-matrix:
    name: Upgrade ${{ matrix.version }} to RC
    needs: static-release
    runs-on: ubuntu-latest
    strategy:
      {
        fail-fast: false,
        matrix:
          { version: ["0.3.0", "0.3.1", "0.3.2", "0.3.3", "0.3.4", "0.3.5", "0.4.0-rc.1", "0.4.0-rc.2", "0.4.0-rc.3", "0.4.0-rc.4", "0.5.0-rc.1", "0.5.0-rc.2", "0.5.0-rc.3", "0.5.0-rc.4"] },
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wordpress-news-bot-rc-packages, path: dist }
      - run: bash tests/integration/run-upgrade.sh "wordpress-news-bot-${{ matrix.version }}.zip"
        env:
          {
            WPNB_ARTIFACTS_DIR: "${{ github.workspace }}/dist",
            WPNB_WP_IMAGE: "wordpress:7.0.4-php8.3-apache",
            WPNB_DB_ENGINE: MyISAM,
            WPNB_PROJECT: "wpnb-upgrade-${{ strategy.job-index }}",
          }

  admin-e2e:
    name: Playwright WordPress admin E2E
    needs: static-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wordpress-news-bot-rc-packages, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: bash tests/integration/run-e2e.sh
        env:
          {
            WPNB_ARTIFACTS_DIR: "${{ github.workspace }}/dist",
            WPNB_WP_IMAGE: "wordpress:7.0.4-php8.3-apache",
            WPNB_DB_ENGINE: MyISAM,
            WPNB_PROJECT: wpnb-e2e,
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: playwright-results,
            path: "tests/e2e/results.json",
            if-no-files-found: warn,
          }

  rc-gate:
    name: RC release gate
    if: always()
    needs:
      [
        php-quality,
        php-myisam,
        static-release,
        wordpress-install,
        upgrade-matrix,
        admin-e2e,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory gate
        env: { RESULTS: "${{ toJSON(needs) }}" }
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
